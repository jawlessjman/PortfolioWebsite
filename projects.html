<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="projects.css">
    <link rel="icon" href="Images/favicon.png" type="image/png">
    <title>Projects — Jared Johnston</title>
</head>
<body class="page-container d-flex flex-column">
<div class="container flex-grow-1 d-flex flex-column py-3">
  <header class="nav-shell d-flex flex-wrap justify-content-center align-items-center py-3 mb-4">
    <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
      <span class="fs-4 brand-mark">Jared Johnston</span>
    </a>
    <ul class="nav nav-pills gap-2">
      <li class="nav-item">
        <a class="nav-link" href="index.html">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" aria-current="page" href="projects.html">Projects</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="https://www.linkedin.com/in/jared-johnston-b11290301/" target="_blank" rel="noopener noreferrer">Resume</a>
      </li>
    </ul>
  </header>

  <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="projectModalLabel" class="modal-title fw-bold"></h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <img id="projectImage" class="img-fluid rounded mb-3 shadow-sm" alt="Project image" >
          <p id="projectLongDescription" class="mb-3"></p>
          <p><strong>Type:</strong> <span id="projectType"></span></p>
          <p><strong>Languages:</strong> <span id="projectLanguages"></span></p>
          <p><strong>Authors:</strong> <span id="projectAuthors"></span></p>
          <p><strong>Status:</strong> <span id="projectStatus"></span></p>
          <p><strong>Extra Links:</strong> <span id="projectExtraLinks"></span></p>
        </div>
        <div class="modal-footer">
          <a id="repoLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-ghost">
            <svg class="bi" width="1em" height="1em" viewBox="0 0 16 16" fill="#FFF">
              <use xlink:href="assets/bootstrap-icons/bootstrap-icons.svg#github"></use>
            </svg>
            View Repository
          </a>
          <div id="extraLinks"></div>
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <main class="flex-grow-1">
    <section class="projects-intro">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
          <div class="eyebrow"><span id="projectNum">0</span> projects across games, bots, and apps</div>
          <h1>Projects</h1>
          <p class="subtle-text mb-0">Curated work spanning mobile, backend helpers, and playful experiments. Tap a card to see details.</p>
        </div>
      </div>
    </section>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-2 g-4" id="projects"></div>
  </main>

  <footer class="footer-shell d-flex flex-wrap justify-content-between align-items-center py-3 mt-4">
    <div class="col-md-4 d-flex align-items-center">
      <a href="#" class="mb-0 text-decoration-none text-muted">Back to top</a>
    </div>
    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
      <li class="ms-3">
        <a class="icon-btn" aria-label="Email" href="mailto:jared@jaredjohnston.com">
          <svg class="bi" viewBox="0 0 16 16">
            <use xlink:href="assets/bootstrap-icons/bootstrap-icons.svg#envelope-fill"></use>
          </svg>
        </a>
      </li>
      <li class="ms-3">
        <a class="icon-btn" aria-label="LinkedIn" href="https://www.linkedin.com/in/jared-johnston-b11290301/">
          <svg class="bi" viewBox="0 0 16 16">
            <use xlink:href="assets/bootstrap-icons/bootstrap-icons.svg#linkedin"></use>
          </svg>
        </a>
      </li>
      <li class="ms-3">
        <a class="icon-btn" aria-label="GitHub" href="https://github.com/jawlessjman">
          <svg class="bi" viewBox="0 0 16 16">
            <use xlink:href="assets/bootstrap-icons/bootstrap-icons.svg#github"></use>
          </svg>
        </a>
      </li>
    </ul>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  async function loadProjects() {
    try {
      const response = await fetch("projects.json");
      if (!response.ok) throw new Error("Unable to load projects");

      const projects = await response.json();
      const grid = document.getElementById("projects");

      const projectNumber = document.getElementById("projectNum");
      projectNumber.textContent = projects.length;

      projects.forEach((project, index) => {
        const card = document.createElement("div");
        card.className = "col";

        const statusClass = getStatusClass(project.status);
        const languageBadges = project.languagesUsed
          .map((lang) => `<span class="language-tag">${lang}</span>`)
          .join("");

        card.innerHTML = `
        <div class="project-card h-100">
          <div class="project-thumb">
            <img src="${project.imageUrl}" loading="lazy" alt="${project.title}">
          </div>
          <div class="card-content">
            <div class="project-meta">
              <span class="project-index" aria-hidden="true">${String(index + 1).padStart(2, "0")}</span>
              <span class="status-chip ${statusClass}">${project.status}</span>
            </div>
            <h2>${project.title}</h2>
            <p class="mb-3 subtle-text">${project.shortDescription}</p>
            <div class="d-flex flex-wrap gap-2">${languageBadges}</div>
          </div>
          <div class="card-actions">
            <button class="details-button" data-index="${index}" aria-label="View details for ${project.title}">View details</button>
          </div>
        </div>
      `;

        grid.appendChild(card);
      });

      // Add modal logic
      document.querySelectorAll("[data-index]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const project = projects[e.currentTarget.getAttribute("data-index")];
          showProjectModal(project);
        });
      });
    } catch (error) {
      console.error("Error loading projects:", error);
      document.getElementById("projects").innerHTML = '<p role="alert" class="subtle-text">Projects could not be loaded. Please refresh to try again.</p>';
    }
  }

  function getStatusClass(status) {
    const normalized = status.toLowerCase();
    if (normalized.includes("inactive")) return "status-inactive";
    if (normalized.includes("active")) return "status-active";
    if (normalized.includes("completed")) return "status-completed";
    if (normalized.includes("progress")) return "status-progress";
    return "status-inactive";
  }

  function normalizeExtraLinks(links) {
    if (!Array.isArray(links)) return [];

    return links.flatMap((link) => {
      if (typeof link === "string") {
        if (!/^https?:\/\//i.test(link)) return [];
        const hostname = new URL(link).hostname.replace(/^www\./i, "");
        return [{ url: link, label: hostname || "View link" }];
      }

      if (link && typeof link === "object") {
        const url = typeof link.url === "string" ? link.url : "";
        if (!/^https?:\/\//i.test(url)) return [];
        return [{
          url,
          label: typeof link.label === "string" && link.label.trim() ? link.label : new URL(url).hostname.replace(/^www\./i, "") || "View link"
        }];
      }

      return [];
    });
  }

  function showProjectModal(project) {
    document.getElementById("projectModalLabel").textContent = project.title;
    document.getElementById("projectImage").src = project.imageUrl;
    document.getElementById("projectImage").alt = project.title;
    document.getElementById("projectLongDescription").textContent = project.longDescription;
    document.getElementById("projectType").textContent = project.projectType;
    document.getElementById("projectLanguages").textContent = project.languagesUsed.join(", ");
    document.getElementById("projectAuthors").textContent = project.authors.join(", ");
    document.getElementById("projectStatus").textContent = project.status;

    const extraLinkList = normalizeExtraLinks(project.extraLinks);
    const projectExtraLinks = document.getElementById("projectExtraLinks");
    projectExtraLinks.replaceChildren();

    if (extraLinkList.length > 0) {
      for (const link of extraLinkList) {
        const anchor = document.createElement("a");
        anchor.href = link.url;
        anchor.textContent = link.label;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        anchor.className = "d-inline-block me-2 text-decoration-none";
        projectExtraLinks.appendChild(anchor);
      }
    } else {
      projectExtraLinks.textContent = "None";
    }

    const repoLink = document.getElementById("repoLink");
    if (project.repoLink) {
      repoLink.href = project.repoLink;
      repoLink.classList.remove("disabled"); repoLink.removeAttribute("aria-disabled"); repoLink.removeAttribute("tabindex");
    } else {
      repoLink.href = "#";
      repoLink.classList.add("disabled"); repoLink.setAttribute("aria-disabled", "true"); repoLink.setAttribute("tabindex", "-1");
    }

    const extraLinks = document.getElementById("extraLinks");
    extraLinks.replaceChildren();
    for (const link of extraLinkList) {
      const anchor = document.createElement("a");
      anchor.href = link.url;
      anchor.textContent = link.label;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      anchor.className = "btn btn-ghost";
      extraLinks.appendChild(anchor);
    }

    const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("projectModal"));
    modal.show();
  }

  document.addEventListener("DOMContentLoaded", loadProjects);

</script>
</body>
</html>
